<div class="grid">
  <div class="box">
    <h3>1. input() ↓ / output() ↑</h3>
    <app-product-list [products]="products" (addToCart)="onAdd($event)" />
  </div>
  <div class="box">
    <h3>2. Shared service (sibling)</h3>
    <app-cart-summary />
  </div>
  <div class="box">
    <h3>3. viewChild() → child API</h3>
    <app-stopwatch />
    <div class="row">
      <button type="button" (click)="start()">start()</button>
      <button type="button" class="secondary" (click)="stop()">stop()</button>
      <button type="button" class="secondary" (click)="reset()">reset()</button>
    </div>
  </div>
</div>
<app-log-panel [entries]="log.entries()" (cleared)="log.clear()" title="Smart container log" />
