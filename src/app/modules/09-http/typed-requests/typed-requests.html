<div class="row">
  <button type="button" (click)="load()">GET /mock/users.json</button>
  <button type="button" class="secondary" (click)="load(true)">Same, with HttpContext SKIP_LOGGING = true</button>
</div>
<div class="row">
  <input [value]="name()" (input)="onName($event)" aria-label="New user name" />
  <button type="button" (click)="create()" [disabled]="saving()">POST /api/users (simulated)</button>
</div>
<table>
  <thead>
    <tr><th>id</th><th>name</th><th>email</th><th>role</th></tr>
  </thead>
  <tbody>
    @for (u of users(); track u.id) {
      <tr><td>{{ u.id }}</td><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>
    } @empty {
      <tr><td colspan="4" class="muted">Click GET to load users.</td></tr>
    }
  </tbody>
</table>
